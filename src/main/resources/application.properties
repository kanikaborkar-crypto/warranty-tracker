# App name
spring.application.name=Warranty Tracker

# Database Configuration (Saves to a local file inside ./data folder)
spring.datasource.url=jdbc:h2:file:./data/warranty-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Tell Spring Boot to map /uploads/** requests directly to the file system's uploads directory
spring.web.resources.static-locations=classpath:/static/,file:uploads/