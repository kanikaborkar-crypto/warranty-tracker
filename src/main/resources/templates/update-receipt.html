<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Receipt</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">✏️ Edit Receipt</h1>

    <form th:action="@{/updateReceipt}" th:object="${receipt}" method="POST" enctype="multipart/form-data">

        <!-- Hidden ID field so Spring knows which existing record to update -->
        <input type="hidden" th:field="*{id}" />

        <!-- Product Name -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Product Name</label>
            <input type="text" th:field="*{productName}" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Category -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
            <select th:field="*{category}" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="Electronics">Electronics</option>
                <option value="Home Appliances">Home Appliances</option>
                <option value="Fitness & Sports">Fitness & Sports</option>
                <option value="Clothing & Shoes">Clothing & Shoes</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Purchase Date -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Purchase Date</label>
            <input type="date" th:field="*{purchaseDate}" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Warranty Months -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Warranty Period (Months)</label>
            <input type="number" th:field="*{warrantyMonths}" min="1" required
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <!-- Buttons -->
        <div class="flex justify-between items-center pt-4">
            <a th:href="@{/}" class="text-gray-600 hover:text-gray-800 font-semibold">Cancel</a>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow">
                Update Receipt
            </button>
        </div>
        <!-- Upload Receipt Image -->
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="imageFile">
                Update Receipt Image / Scan
            </label>
            <input type="file"
                   id="imageFile"
                   name="imageFile"
                   accept="image/*"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">

            <!-- Optional note if an image already exists -->
            <p th:if="${receipt.receiptImgUrl != null and !receipt.receiptImgUrl.isEmpty()}"
               class="text-xs text-blue-600 mt-1 font-semibold">
                📷 Current image attached. Choose a new file only if you want to replace it.
            </p>
        </div>
    </form>
</div>
</body>
</html>
